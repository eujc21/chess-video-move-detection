name: Rust

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: "off"

defaults:
  run:
    working-directory: rust

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features gui -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are Apple Silicon, so this also builds the CoreML path for real.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Unit tests and Gherkin scenarios
        run: cargo test --features gui
      - name: Build CLI and desktop app
        run: cargo build --release --features gui --bins
      # Open the real window, render a few frames and exit. Catches start-up
      # crashes (e.g. a missing graphics backend) that building alone cannot.
      - name: Smoke test desktop app (Linux, OpenGL and Vulkan)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-vulkan-drivers libxkbcommon-x11-0
          xvfb-run -a ./target/release/chess-video-gui --smoke-test --renderer glow
          xvfb-run -a ./target/release/chess-video-gui --smoke-test --renderer wgpu
      - name: Smoke test desktop app (macOS, Metal)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: ./target/release/chess-video-gui --smoke-test --renderer auto
      - name: Smoke test desktop app (Windows, DirectX 12)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: ./target/release/chess-video-gui.exe --smoke-test --renderer wgpu

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check --all-targets --features gui

  freebsd:
    name: FreeBSD (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Runs a real FreeBSD virtual machine, so the tests execute on FreeBSD
      # rather than only being type-checked for it.
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y rust
          run: |
            cd rust
            rustc --version
            cargo test --features gui
