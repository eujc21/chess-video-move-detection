[package]
name = "chess-video-moves"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust port of the chess video move detection pipeline"
license = "MIT"
default-run = "chess-video-moves"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
shakmaty = "0.30.0"
# Default features keep wgpu's native backends (Metal on macOS, Vulkan/GL elsewhere).
eframe = { version = "0.33", optional = true, features = ["wgpu"] }

# On macOS always build the CoreML execution provider (Metal GPU + Neural Engine).
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["coreml"] }

[features]
# Desktop app with webcam capture: `cargo run --release --features gui --bin chess-video-gui`.
gui = ["dep:eframe"]
# CoreML is enabled automatically on macOS; this only allows compile-checking it elsewhere.
coreml = ["ort/coreml"]
# GPU execution providers (require a matching ONNX Runtime build at runtime).
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]

[[bin]]
name = "chess-video-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
cucumber = "0.23"
futures = "0.3"

# Gherkin (Cucumber) behaviour tests in tests/features; run with `cargo test --test bdd`.
[[test]]
name = "bdd"
harness = false
